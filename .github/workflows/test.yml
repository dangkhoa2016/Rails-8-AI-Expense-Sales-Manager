name: Rails finance checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rails8_ai_expense_sales_manager_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rails8_ai_expense_sales_manager_test
    steps:
      - uses: actions/checkout@v4
      - name: Install libvips
        run: sudo apt-get update -qq && sudo apt-get install -y libvips42t64
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'
          bundler-cache: true
      - run: bin/rails db:prepare
      - run: bin/rails test
      - run: ruby tests/test_input_policy.rb
