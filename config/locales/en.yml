    guide:
      eyebrow: PRODUCT GUIDE
      title: Understand your financial workflow
      subtitle: Make the most of AI assistance without giving up control of financial data.
      step1:
        title: Start with a draft
        body: Record income or expense without needing a receipt. Drafts can be edited and are not counted
          in reports.
      step2:
        title: Attach and retain images
        body: Each upload creates a separate evidence version with SHA256. Previous images remain accessible
          for review and financial investigation.
      step3:
        title: Review each field
        body: When approved AI inference becomes available, proposals will appear by field. Missing or
          unreadable information stays blank and can be entered manually.
      step4:
        title: Confirm the actual date and amount
        body: Transaction date is required to confirm a record. Never infer missing dates from EXIF, upload
          timestamp or unrelated fields.
      step5:
        title: Use trustworthy analytics
        body: Reports, charts and CSV reflect confirmed database values only. Drafts and AI-only proposals
          are excluded.
      faq:
        title: Common questions
      faq1:
        q: What if a receipt is blurry or handwritten?
        a: Upload a clearer image or use manual entry. The system should never fabricate a date or amount
          when recognition is unreliable.
      faq2:
        q: Can I replace an image after confirmation?
        a: You can add a new version, but confirmed financial values and the reference image remain locked.
          New images are supplemental evidence.
      faq3:
        q: Is AI receipt extraction enabled in this demo?
        a: No. The GGUF inference adapter remains disabled pending quality approval. Manual entry and
          document history are usable now.
