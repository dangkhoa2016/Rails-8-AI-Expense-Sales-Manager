        help: Nhập số tiền VND dạng chữ số không có dấu phân nhóm, ví dụ 43500. Kiểm tra lại trước khi
          xác nhận.
      lines:
        help: Có thể để trống các dòng chi tiết khi lưu nháp. Chỉnh sửa từng khoản và không tự cho rằng
          tổng các dòng bằng số tiền xác nhận.
