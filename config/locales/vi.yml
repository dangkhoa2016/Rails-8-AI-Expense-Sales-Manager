      title: Các khoản chi tiết trong hóa đơn
      subtitle: Quản lý từng khoản mua, nhập danh sách dài và đối chiếu với tổng tiền giao dịch.
      count: Số khoản chi tiết
      lines_total: Tổng các dòng chi tiết
      invoice_total: Số tiền giao dịch
      confirmed_deletion_hint: Khoản đã xác nhận không thể xóa trực tiếp. Chọn Sửa chi tiết khoản để tạo bản hiệu chỉnh, rồi xóa khoản trong bản nháp đó.
      unallocated_item_amount: Số tiền ngoài danh sách khoản chi tiết
      unallocated_item_hint: Có thể do phí, thuế, giảm giá hoặc điều chỉnh trước đây. Hãy đối chiếu chứng từ gốc; giao dịch đã xác nhận không được tự ý sửa.
      import_title: Nhập hàng loạt khoản chi từ CSV
      import_help: CSV UTF-8 cần description,amount; các cột quantity,unit_price,tags,occurred_time,location_text là tùy chọn. Ngày lấy từ giao dịch; CSV cũ có occurred_on chỉ hợp lệ khi trùng ngày giao dịch. Không chạy OCR.
      import_limit: Tối đa 500 dòng mỗi tệp và mỗi giao dịch, tối đa 512 KiB. Dòng sai sẽ hủy toàn bộ lượt nhập.
        Tải lại cùng tệp không tạo dữ liệu trùng.
      csv_label: Chọn tệp CSV
      import_button: Nhập các dòng vào bản nháp
