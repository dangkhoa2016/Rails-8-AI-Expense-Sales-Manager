      title: Chào mừng trở lại
      subtitle: Đăng nhập để quản lý khoản thu/chi và kiểm tra chứng từ.
      email: Địa chỉ email
      password: Mật khẩu
      signin: Đăng nhập
      forgot: Quên mật khẩu?
      signup:
