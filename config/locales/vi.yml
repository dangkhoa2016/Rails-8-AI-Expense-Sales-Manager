    detail:
      eyebrow: HỒ SƠ GIAO DỊCH
      title: 'Giao dịch #%{id}'
      subtitle: Xem thông tin tài chính, phiên bản ảnh và lịch sử kiểm soát.
      confirm:
        title: Sẵn sàng xác nhận?
        help: Chỉ xác nhận sau khi kiểm tra ngày, loại thu/chi và số tiền. Giao dịch sẽ được khóa và đưa vào báo
          cáo.
        checkbox: Tôi đã kiểm tra ngày, loại giao dịch, số tiền và chứng từ.
        button: Xác nhận ghi nhận thu chi
        locked: Giao dịch đã chốt không thể sửa trực tiếp. Có thể thêm ảnh làm bằng chứng mà không đổi ngày hoặc
          số tiền.
      edit: Chỉnh sửa bản nháp
      summary: Thông tin đã kiểm tra
      confirmed_at: Thời điểm xác nhận
      upload:
        help: Ảnh JPEG, PNG hoặc WEBP, tối đa 10 MB. Phiên bản cũ được lưu lại để đối chiếu và kiểm toán.
        button: Lưu phiên bản ảnh
        title: Tải thêm ảnh
      image:
        version: Phiên bản %{number}
        active: Chứng từ đã chốt
        supplement: Chứng từ bổ sung
      ai:
        unreadable: Ảnh không đủ rõ để nhận diện đáng tin cậy. Vui lòng nhập tay hoặc tải ảnh rõ hơn.
        error: Xử lý ảnh gặp lỗi kỹ thuật, không có nghĩa ảnh không đọc được. Bạn có thể thử lại hoặc nhập tay.
        partial: AI đọc được một số trường. Hãy kiểm tra từng gợi ý và nhập tay phần còn thiếu.
        manual: Bạn luôn có thể nhập thủ công.
        title: Trạng thái đọc chứng từ
      audit:
        empty: Chưa có hoạt động kiểm soát.
        title: Lịch sử kiểm soát
      items:
        empty: Chưa có khoản chi tiết.
        title: Các khoản chi tiết
      documents:
        view_version: Xem ảnh chứng từ phiên bản %{number}
        image_alt: Ảnh chứng từ phiên bản %{number}
        file_unavailable: File ảnh không có trong bản lưu trữ.
        current_version: Ảnh đang chọn
        empty: Chưa tải ảnh chứng từ.
        title: Các phiên bản chứng từ
      back: Quay lại danh sách
      context:
        title: Chi tiết mua sắm và thanh toán
        details: Mua hoặc thanh toán cho việc gì
        time: Giờ phát sinh (tùy chọn)
        location: Địa điểm (tùy chọn)
        empty: Chưa nhập thông tin bổ sung cho giao dịch.
