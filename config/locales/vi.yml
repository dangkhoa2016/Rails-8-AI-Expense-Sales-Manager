      uploaded: Đã tải lên %{value}
      original: Mở ảnh gốc
      ai:
        empty: Chưa chạy AI trên phiên bản ảnh này.
        title: Lịch sử AI nhận diện
      warning: Chứng từ riêng tư. Chỉ người được phân quyền trong workspace mới được xem.
    auth:
      title: Chào mừng trở lại
      subtitle: Đăng nhập để quản lý khoản thu/chi và kiểm tra chứng từ.
      email: Địa chỉ email
      password: Mật khẩu
      signin: Đăng nhập
      forgot: Quên mật khẩu?
      signup:
        subtitle: Không gian tài chính riêng được tạo cùng tài khoản của bạn.
        title: Tạo tài khoản
      password_confirmation: Xác nhận mật khẩu
      preview:
        disabled: Bản demo tạm thời không cho đăng ký tài khoản mới.
        help: Sử dụng thông tin tài khoản demo đã được cung cấp.
      reset_title: Đặt lại mật khẩu
      reset_help: Nhập địa chỉ email để yêu cầu liên kết đặt lại mật khẩu.
      reset_send: Gửi hướng dẫn đặt lại
      new_password: Mật khẩu mới
      reset_save: Lưu mật khẩu mới
    guide:
      eyebrow: HƯỚNG DẪN SỬ DỤNG
      title: Hiểu quy trình thu chi
      subtitle: Tận dụng AI để giảm nhập liệu nhưng vẫn kiểm soát dữ liệu tài chính.
      step1:
        title: Bắt đầu từ bản nháp
        body: Bạn có thể ghi khoản thu hoặc chi ngay cả khi chưa có ảnh. Bản nháp được chỉnh sửa và không tính vào
          báo cáo.
      step2:
        title: Tải ảnh và lưu phiên bản
        body: Mỗi ảnh được lưu thành phiên bản riêng có SHA256. Ảnh cũ luôn có thể mở lại để kiểm tra, đối chiếu.
      step3:
        title: Kiểm tra từng trường
        body: Khi AI được tích hợp và chấp thuận, các trường gợi ý sẽ hiện riêng. Phần khó đọc để trống và cho phép
          nhập tay.
      step4:
        title: Xác nhận ngày và số tiền thực
        body: Phải có ngày giao dịch trước khi xác nhận. Không suy ngày thiếu từ EXIF, thời điểm tải ảnh hoặc trường
          khác.
      step5:
        title: Thống kê từ giao dịch đã chốt
        body: Báo cáo, biểu đồ và CSV chỉ lấy giá trị đã xác nhận trong cơ sở dữ liệu, không tính bản nháp hay gợi
          ý AI chưa duyệt.
      faq:
        title: Câu hỏi thường gặp
      faq1:
        q: Nếu hóa đơn mờ hoặc chữ viết tay khó đọc thì sao?
        a: Bạn có thể tải ảnh rõ hơn hoặc nhập tay. Hệ thống không được tự đoán ngày hoặc số tiền khi không đọc
          chắc chắn.
      faq2:
        q: Có thể thay ảnh sau khi đã chốt giao dịch không?
        a: Có thể tải phiên bản mới, nhưng giá trị tài chính và ảnh tham chiếu đã chốt không thay đổi. Ảnh mới là
          bằng chứng bổ sung.
      faq3:
        q: Bản demo đã bật AI đọc hóa đơn chưa?
        a: Chưa. Adapter GGUF vẫn tắt để chờ nghiệm thu chất lượng. Nhập tay và lịch sử ảnh đang sử dụng được.
      context_note: Ngày phát sinh bắt buộc khi xác nhận. Giờ và địa điểm có thể bỏ trống.
    flash:
      draft_created: Đã lưu bản nháp. Hãy kiểm tra và xác nhận trước khi đưa vào báo cáo.
      draft_updated: Đã cập nhật bản nháp.
      confirmed: Đã xác nhận giao dịch.
      image_saved: Đã lưu phiên bản ảnh mới. Các phiên bản trước vẫn được giữ lại.
      suggestion_reviewed: Đã đánh dấu xem gợi ý. Hãy kiểm tra form trước khi xác nhận.
      suggestion_rejected: Đã từ chối gợi ý.
      account_created: Đã tạo tài khoản.
      signin_failed: Vui lòng kiểm tra địa chỉ email hoặc mật khẩu.
      password_sent: Nếu email tồn tại, hướng dẫn đặt lại mật khẩu đã được gửi.
      password_reset: Đã đặt lại mật khẩu.
      password_mismatch: Mật khẩu xác nhận không khớp.
      password_invalid: Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.
